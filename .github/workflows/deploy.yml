name: Deploy VPS

on:
  workflow_run:
    workflows: [macOS CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server release
        run: |
          python3 -m unittest discover -s tests -v
          node --check server/app.js
          node tests/test_dashboard.cjs
          node tests/test_browser.js
          bash -n deploy/install.sh
          python3 -m py_compile deploy/release.py
      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST}" "${VPS_SSH_KEY:?Set VPS_SSH_KEY}" "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          port=${VPS_PORT:-22}
          [[ "$port" =~ ^[0-9]+$ ]]
          key="$RUNNER_TEMP/orbit-deploy-key"
          known="$RUNNER_TEMP/orbit-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known"
          revision=$(git rev-parse HEAD)
          git archive --format=tar HEAD server/ | ssh -T -i "$key" -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" "orbit-deploy@$VPS_HOST" \
            "sudo -n /usr/local/sbin/orbit-deploy $revision"
